<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Code – חיפוש שיחות</title>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --card: #1c2230;
      --border: #30363d;
      --accent: #58a6ff;
      --accent2: #a371f7;
      --success: #3fb950;
      --warn: #e3b341;
      --text: #e6edf3;
      --muted: #7d8590;
      --radius: 8px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      font-size: 14px;
    }

    /* ===== Header ===== */
    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0.6rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-shrink: 0;
    }
    .header h1 { font-size: 0.95rem; font-weight: 600; }
    .header .stats { color: var(--muted); font-size: 0.8rem; margin-right: auto; }
    .btn {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.3rem 0.8rem;
      color: var(--text);
      font-size: 0.8rem;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      white-space: nowrap;
    }
    .btn:hover { border-color: var(--accent); background: rgba(88,166,255,0.08); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 600; }
    .btn.primary:hover { background: #79bbff; }

    /* ===== Layout ===== */
    .main { display: flex; flex: 1; overflow: hidden; }

    /* ===== Sidebar ===== */
    .sidebar {
      width: 320px;
      flex-shrink: 0;
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .search-area {
      padding: 0.6rem;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .search-input {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.45rem 0.7rem;
      color: var(--text);
      font-size: 0.88rem;
      outline: none;
      transition: border-color 0.15s;
    }
    .search-input:focus { border-color: var(--accent); }
    .search-input::placeholder { color: var(--muted); }
    .filter-row { display: flex; gap: 0.4rem; }
    .filter-select {
      flex: 1;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.3rem 0.5rem;
      color: var(--text);
      font-size: 0.78rem;
      outline: none;
      min-width: 0;
    }

    /* ===== Results list ===== */
    .results-list { flex: 1; overflow-y: auto; padding: 0.4rem; }
    .results-list::-webkit-scrollbar { width: 4px; }
    .results-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .result-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.65rem 0.75rem;
      margin-bottom: 0.4rem;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .result-card:hover { border-color: var(--accent); background: rgba(88,166,255,0.05); }
    .result-card.active { border-color: var(--accent); background: rgba(88,166,255,0.08); }

    .result-title {
      font-size: 0.83rem;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 0.25rem;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      line-height: 1.45;
    }
    .result-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      color: var(--muted);
      margin-bottom: 0.3rem;
    }
    .result-snippet {
      font-size: 0.76rem;
      color: var(--muted);
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      line-height: 1.5;
    }
    .result-snippet mark, .result-title mark {
      background: rgba(88,166,255,0.2);
      color: var(--accent);
      padding: 0 1px;
      border-radius: 2px;
    }

    /* ===== Viewer ===== */
    .viewer { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .welcome {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      text-align: center;
      padding: 2rem;
      gap: 0.75rem;
    }
    .welcome-icon { font-size: 2.5rem; opacity: 0.5; }
    .welcome h2 { font-size: 1rem; font-weight: 500; }
    .welcome p { font-size: 0.83rem; line-height: 1.6; max-width: 300px; }

    .viewer-content { display: none; flex: 1; flex-direction: column; overflow: hidden; }
    .viewer-content.visible { display: flex; }
    .viewer-header {
      padding: 0.65rem 1.1rem;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }
    .viewer-title {
      font-size: 0.85rem;
      font-weight: 500;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      flex: 1;
    }
    .viewer-meta { font-size: 0.75rem; color: var(--muted); white-space: nowrap; }

    /* ===== Messages ===== */
    .messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 1rem 1.1rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }
    .messages-container::-webkit-scrollbar { width: 4px; }
    .messages-container::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .message-role {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 0.3rem;
      color: var(--muted);
    }
    .message.user .message-role { color: var(--accent); }
    .message.assistant .message-role { color: var(--accent2); }

    .message-bubble {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.65rem 0.85rem;
      font-size: 0.86rem;
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
      max-width: 92%;
    }
    .message.user .message-bubble { background: #1a2535; border-color: #2d3d52; }
    .message-bubble mark {
      background: rgba(227,179,65,0.28);
      color: var(--warn);
      padding: 0 2px;
      border-radius: 2px;
    }

    /* ===== Loading overlay ===== */
    .loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(13,17,23,0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.85rem;
      z-index: 100;
    }
    .loading-overlay.hidden { display: none; }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { color: var(--text); font-size: 0.9rem; }
    .loading-sub { color: var(--muted); font-size: 0.8rem; }

    /* ===== Empty state ===== */
    .empty-state { text-align: center; padding: 2rem 1rem; color: var(--muted); font-size: 0.83rem; line-height: 1.7; }

    /* ===== In-conversation search ===== */
    .conv-search-bar {
      padding: 0.4rem 0.75rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(63,185,80,0.04);
      flex-shrink: 0;
    }
    .conv-search-input {
      flex: 1;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.3rem 0.65rem;
      color: var(--text);
      font-size: 0.82rem;
      outline: none;
      transition: border-color 0.15s;
    }
    .conv-search-input:focus { border-color: var(--success); }
    .conv-search-input::placeholder { color: var(--muted); }
    .conv-search-count {
      font-size: 0.75rem;
      color: var(--muted);
      white-space: nowrap;
      min-width: 60px;
      text-align: center;
    }
    .message-bubble mark.conv-mark {
      background: rgba(63,185,80,0.28);
      color: var(--success);
      padding: 0 2px;
      border-radius: 2px;
    }
    .message-bubble mark.conv-mark.current {
      background: rgba(63,185,80,0.55);
      outline: 1px solid var(--success);
    }

    /* ===== Toast ===== */
    .toast {
      position: fixed;
      bottom: 1.25rem;
      left: 50%;
      transform: translateX(-50%);
      background: var(--success);
      color: #0a1a0a;
      font-size: 0.83rem;
      font-weight: 600;
      padding: 0.45rem 1.1rem;
      border-radius: 20px;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
      z-index: 200;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>

<div class="loading-overlay hidden" id="loadingOverlay">
  <div class="spinner"></div>
  <div class="loading-text" id="loadingText">טוען שיחות...</div>
  <div class="loading-sub" id="loadingSub"></div>
</div>

<div class="toast" id="toast"></div>

<div class="header">
  <h1>🔍 Claude Code — חיפוש שיחות</h1>
  <span class="stats" id="statsText"></span>
  <button class="btn primary" onclick="openFolder()">📁 פתח תיקיית שיחות</button>
</div>

<div class="main">
  <div class="sidebar">
    <div class="search-area">
      <input
        type="text"
        id="searchInput"
        class="search-input"
        placeholder="חיפוש בכל השיחות..."
        oninput="onSearch()"
        disabled
      />
      <div class="filter-row">
        <select id="projectFilter" class="filter-select" onchange="onSearch()" disabled>
          <option value="">כל הפרויקטים</option>
        </select>
        <select id="sortSelect" class="filter-select" style="width:110px;flex:none" onchange="onSearch()" disabled>
          <option value="date">לפי תאריך</option>
          <option value="relevance">לפי רלוונטיות</option>
        </select>
      </div>
    </div>
    <div class="results-list" id="resultsList">
      <div class="empty-state">
        <div style="font-size:2rem;margin-bottom:0.5rem">📂</div>
        לחץ "פתח תיקיית שיחות"<br>ובחר את תיקיית <strong>.claude\projects</strong>
        <div style="margin-top:0.75rem;font-size:0.75rem;opacity:0.7">
          C:\Users\..\.claude\projects
        </div>
      </div>
    </div>
  </div>

  <div class="viewer">
    <div class="welcome" id="welcomePanel">
      <div class="welcome-icon">💬</div>
      <h2>בחר שיחה מהרשימה</h2>
      <p>חפש בכל תוכן השיחות שלך — הודעות, קוד, פתרונות.</p>
    </div>
    <div class="viewer-content" id="viewerContent">
      <div class="viewer-header">
        <div class="viewer-title" id="viewerTitle"></div>
        <div class="viewer-meta" id="viewerMeta"></div>
        <button class="btn" onclick="openConvSearch()" title="Ctrl+F">🔍 חפש בשיחה</button>
        <button class="btn" id="resumeBtn" onclick="copyResume()">📋 העתק פקודת resume</button>
      </div>
      <div class="conv-search-bar" id="convSearchBar" style="display:none">
        <input type="text" id="convSearchInput" class="conv-search-input"
               placeholder="חיפוש בשיחה זו..."
               oninput="onConvSearch()" onkeydown="convSearchKey(event)"/>
        <span class="conv-search-count" id="convSearchCount"></span>
        <button class="btn" onclick="convSearchNav(-1)" title="קודם">↑</button>
        <button class="btn" onclick="convSearchNav(1)" title="הבא">↓</button>
        <button class="btn" onclick="closeConvSearch()">✕</button>
      </div>
      <div class="messages-container" id="messagesContainer"></div>
    </div>
  </div>
</div>

<script>
const sessions = [];
let activeSessionId = null;
let currentQuery = '';
let convQuery = '';
let convMatches = [];
let convMatchIdx = 0;

// ===== Folder loading =====

async function openFolder() {
  if (!('showDirectoryPicker' in window)) {
    alert('הדפדפן שלך לא תומך ב-File System Access API.\nאנא השתמש ב-Chrome או Edge.');
    return;
  }
  try {
    const dir = await window.showDirectoryPicker({ mode: 'read' });
    await loadSessions(dir);
  } catch (e) {
    if (e.name !== 'AbortError') alert('שגיאה בטעינה:\n' + e.message);
  }
}

async function loadSessions(rootHandle) {
  setLoading(true, 'סורק תיקיות...', '');
  sessions.length = 0;

  const allFiles = [];

  for await (const [projName, projHandle] of rootHandle.entries()) {
    if (projHandle.kind !== 'directory') continue;
    for await (const [fileName, fileHandle] of projHandle.entries()) {
      if (fileHandle.kind !== 'file') continue;
      if (!fileName.endsWith('.jsonl')) continue;
      const sessId = fileName.replace(/\.jsonl$/, '');
      allFiles.push({ projName, sessId, fileHandle });
    }
  }

  setLoading(true, 'טוען שיחות...', `0 / ${allFiles.length}`);
  let done = 0;

  for (const { projName, sessId, fileHandle } of allFiles) {
    try {
      const file = await fileHandle.getFile();
      const text = await file.text();
      const s = parseSession(text, sessId, projName, file.lastModified);
      if (s) sessions.push(s);
    } catch { /* skip */ }
    done++;
    if (done % 8 === 0) {
      document.getElementById('loadingSub').textContent = `${done} / ${allFiles.length}`;
      await tick();
    }
  }

  sessions.sort((a, b) => b.date - a.date);
  buildProjectFilter();
  enableControls();
  setLoading(false);
  document.getElementById('statsText').textContent = `${sessions.length} שיחות`;
  renderResults(sessions);
}

// ===== JSONL Parsing =====

function parseSession(rawText, sessId, projName, lastModified) {
  const lines = rawText.split('\n');
  let date = null;
  let title = null;
  const messages = [];

  for (const line of lines) {
    if (!line.trim()) continue;
    let r;
    try { r = JSON.parse(line); } catch { continue; }

    if (!date && r.timestamp) date = new Date(r.timestamp);

    if (!title && r.type === 'last-prompt' && r.lastPrompt) {
      title = r.lastPrompt.replace(/\s+/g, ' ').trim().slice(0, 100);
    }

    if (r.type === 'user' && r.message?.role === 'user') {
      const txt = extractText(r.message.content);
      if (txt) {
        if (!title) title = txt.slice(0, 100);
        messages.push({ role: 'user', text: txt });
      }
    }

    if (r.type === 'assistant' && r.message?.role === 'assistant') {
      const txt = extractText(r.message.content);
      if (txt) messages.push({ role: 'assistant', text: txt });
    }
  }

  if (messages.length === 0) return null;

  const projectPath = decodePath(projName);
  return {
    id: sessId,
    projName,
    projectPath,
    projectShort: projectPath.split('\\').pop() || projName,
    date: date || new Date(lastModified),
    title: title || 'שיחה ללא כותרת',
    messages,
    searchText: (title + '\n' + messages.map(m => m.text).join('\n')).toLowerCase(),
  };
}

function extractText(content) {
  if (!Array.isArray(content)) return '';
  const parts = [];
  for (const block of content) {
    if (block.type === 'text' && block.text) {
      const cleaned = block.text
        // Strip system/noisy tags AND their content
        .replace(/<system-reminder>[\s\S]*?<\/system-reminder>/g, '')
        .replace(/<user-prompt-submit-hook>[\s\S]*?<\/user-prompt-submit-hook>/g, '')
        // For all other tags: remove tag markers but keep their content
        .replace(/<[^>]+>/g, ' ')
        .replace(/\s{3,}/g, '\n\n')
        .trim();
      if (cleaned) parts.push(cleaned);
    }
  }
  return parts.join('\n').trim();
}

function decodePath(name) {
  return name.replace(/^([cC])--/, '$1:\\').replace(/--/g, '\\');
}

// ===== Search =====

function onSearch() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const proj = document.getElementById('projectFilter').value;
  const sort = document.getElementById('sortSelect').value;
  currentQuery = q;

  let list = sessions;
  if (proj) list = list.filter(s => s.projName === proj);
  if (q) {
    list = list.filter(s => s.searchText.includes(q));
    if (sort === 'relevance') {
      list = [...list].sort((a, b) => countOccurrences(b.searchText, q) - countOccurrences(a.searchText, q));
    }
  }

  renderResults(list);
}

function countOccurrences(str, sub) {
  let n = 0, pos = 0;
  while ((pos = str.indexOf(sub, pos)) !== -1) { n++; pos++; }
  return n;
}

// ===== Render results =====

function renderResults(list) {
  const el = document.getElementById('resultsList');
  if (!list.length) {
    el.innerHTML = `<div class="empty-state">${currentQuery ? `לא נמצאו תוצאות עבור "<strong>${esc(currentQuery)}</strong>"` : 'אין שיחות להצגה'}</div>`;
    return;
  }
  el.innerHTML = list.map(s => {
    const active = s.id === activeSessionId ? ' active' : '';
    const snippet = currentQuery ? buildSnippet(s.searchText, currentQuery) : '';
    return `<div class="result-card${active}" onclick="openSession('${s.id}')">
      <div class="result-title">${hl(esc(s.title), currentQuery)}</div>
      <div class="result-meta">
        <span title="${esc(s.projectPath)}">${esc(s.projectShort)}</span>
        <span>${fmtDate(s.date)}</span>
      </div>
      ${snippet ? `<div class="result-snippet">${snippet}</div>` : ''}
    </div>`;
  }).join('');
}

function buildSnippet(fullText, q) {
  const idx = fullText.indexOf(q);
  if (idx === -1) return '';
  const start = Math.max(0, idx - 55);
  const end = Math.min(fullText.length, idx + q.length + 90);
  let chunk = fullText.slice(start, end).replace(/\n/g, ' ');
  if (start > 0) chunk = '...' + chunk;
  if (end < fullText.length) chunk += '...';
  return hl(esc(chunk), q);
}

// ===== Open conversation =====

function openSession(sessId) {
  const s = sessions.find(x => x.id === sessId);
  if (!s) return;
  activeSessionId = sessId;

  document.querySelectorAll('.result-card').forEach(el => {
    el.classList.toggle('active', el.getAttribute('onclick')?.includes(`'${sessId}'`));
  });

  document.getElementById('welcomePanel').style.display = 'none';
  document.getElementById('viewerContent').classList.add('visible');
  document.getElementById('viewerTitle').textContent = s.title;
  document.getElementById('viewerMeta').textContent = fmtDate(s.date) + ' · ' + s.projectShort;
  document.getElementById('resumeBtn').dataset.id = sessId;

  closeConvSearch();
  renderMessages(s);

  if (currentQuery) {
    setTimeout(() => {
      const m = document.getElementById('messagesContainer').querySelector('mark');
      if (m) m.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 80);
  }
}

function renderMessages(s) {
  const container = document.getElementById('messagesContainer');
  container.innerHTML = s.messages.map(msg => {
    const label = msg.role === 'user' ? '👤 אתה' : '🤖 Claude';
    let body = esc(msg.text);
    if (currentQuery) body = hl(body, currentQuery);
    if (convQuery) body = hlConv(body, convQuery);
    return `<div class="message ${msg.role}">
      <div class="message-role">${label}</div>
      <div class="message-bubble">${body}</div>
    </div>`;
  }).join('');
  container.scrollTop = 0;
}

// ===== In-conversation search =====

function openConvSearch() {
  if (!activeSessionId) return;
  document.getElementById('convSearchBar').style.display = 'flex';
  document.getElementById('convSearchInput').focus();
}

function closeConvSearch() {
  document.getElementById('convSearchBar').style.display = 'none';
  document.getElementById('convSearchInput').value = '';
  document.getElementById('convSearchCount').textContent = '';
  convQuery = '';
  convMatches = [];
  const s = sessions.find(x => x.id === activeSessionId);
  if (s) renderMessages(s);
}

function onConvSearch() {
  convQuery = document.getElementById('convSearchInput').value.trim();
  const s = sessions.find(x => x.id === activeSessionId);
  if (!s) return;
  renderMessages(s);
  setTimeout(() => {
    convMatches = Array.from(document.querySelectorAll('#messagesContainer .conv-mark'));
    convMatchIdx = 0;
    updateConvCount();
    if (convMatches.length > 0) activateConvMatch(0);
  }, 10);
}

function convSearchKey(e) {
  if (e.key === 'Enter') { e.preventDefault(); convSearchNav(e.shiftKey ? -1 : 1); }
  if (e.key === 'Escape') closeConvSearch();
}

function convSearchNav(dir) {
  if (!convMatches.length) return;
  convMatches[convMatchIdx]?.classList.remove('current');
  convMatchIdx = (convMatchIdx + dir + convMatches.length) % convMatches.length;
  activateConvMatch(convMatchIdx);
}

function activateConvMatch(idx) {
  convMatches[idx].classList.add('current');
  convMatches[idx].scrollIntoView({ behavior: 'smooth', block: 'center' });
  updateConvCount();
}

function updateConvCount() {
  document.getElementById('convSearchCount').textContent = convMatches.length > 0
    ? `${convMatchIdx + 1} / ${convMatches.length}`
    : (convQuery ? '0 תוצאות' : '');
}

document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'f' && activeSessionId) {
    e.preventDefault();
    openConvSearch();
  }
});

// ===== Resume command =====

function copyResume() {
  const id = document.getElementById('resumeBtn').dataset.id;
  if (!id) return;
  navigator.clipboard.writeText(`claude --resume ${id}`)
    .then(() => showToast('✅ הועתק! הדבק בטרמינל'))
    .catch(() => {
      prompt('העתק ידנית:', `claude --resume ${id}`);
    });
}

// ===== Project filter =====

function buildProjectFilter() {
  const projects = [...new Set(sessions.map(s => s.projName))].sort();
  const sel = document.getElementById('projectFilter');
  sel.innerHTML = '<option value="">כל הפרויקטים</option>' +
    projects.map(p => {
      const short = decodePath(p).split('\\').pop() || p;
      return `<option value="${esc(p)}">${esc(short)}</option>`;
    }).join('');
}

function enableControls() {
  ['searchInput', 'projectFilter', 'sortSelect'].forEach(id => {
    document.getElementById(id).disabled = false;
  });
  document.getElementById('searchInput').focus();
}

// ===== Utils =====

function fmtDate(d) {
  if (!d) return '';
  const diff = Date.now() - d;
  const days = Math.floor(diff / 86400000);
  if (days === 0) return 'היום';
  if (days === 1) return 'אתמול';
  if (days < 7) return `לפני ${days} ימים`;
  return d.toLocaleDateString('he-IL', { day: 'numeric', month: 'short' });
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function hl(html, q) {
  if (!q) return html;
  return html.replace(new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`, 'gi'), '<mark>$1</mark>');
}

function hlConv(html, q) {
  if (!q) return html;
  return html.replace(new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`, 'gi'), '<mark class="conv-mark">$1</mark>');
}

function setLoading(on, text = '', sub = '') {
  document.getElementById('loadingOverlay').classList.toggle('hidden', !on);
  if (text) document.getElementById('loadingText').textContent = text;
  document.getElementById('loadingSub').textContent = sub;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function tick() { return new Promise(r => setTimeout(r, 0)); }
</script>
